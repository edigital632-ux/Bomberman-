<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Bomberman Battle Online - Zapia</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body { margin: 0; background: #1a1a1a; color: white; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; }
    #lobby { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; overflow-y: auto; }
    #canvas-container { position: relative; width: 100%; max-width: 600px; aspect-ratio: 15/13; }
    canvas { width: 100%; height: auto; background: #2e7d32; border: 4px solid #fff; image-rendering: pixelated; display: block; transition: background 1s ease; }
    .controls { width: 100%; max-width: 600px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .dpad { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; }
    .btn { width: 60px; height: 60px; background: #444; border: 2px solid #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; cursor: pointer; }
    .btn:active { background: #666; }
    .btn-bomb { width: 85px; height: 85px; border-radius: 50%; background: #d32f2f; font-weight: bold; border: 4px solid #fff; cursor: pointer; }
    .btn-bomb:active { background: #ff5252; }
    input { padding: 10px; margin: 5px; border-radius: 5px; width: 220px; text-align: center; border: 2px solid #555; font-family: inherit; background: #222; color: #fff; }
    button#join-btn { padding: 15px 30px; background: #f44336; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button#join-btn:disabled { background: #777; cursor: default; }
    #status { padding: 10px; color: #ffeb3b; min-height: 24px; }
    
    #scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 600px; padding: 8px 15px; font-weight: bold; font-size: 16px; text-transform: uppercase; background: #222; border: 2px solid #555; margin-bottom: 5px; border-radius: 5px; }
    .score-side { display: flex; align-items: center; }
    
    #lobby-error { color: #ff5252; font-size: 13px; min-height: 18px; margin-top: 5px; }
    #room-share { font-size: 12px; color: #9ccc65; margin-top: 4px; }
    #event-log { font-size: 12px; color: #80d8ff; min-height: 18px; margin-top: 2px; transition: opacity 0.3s; }
    #phase-banner { font-size: 14px; color: #fff176; min-height: 18px; margin-top: 2px; }

    #ranking-box { margin-top: 25px; background: #222; border: 2px dashed #ffeb3b; padding: 15px; width: 320px; border-radius: 5px; text-align: left; }
    #ranking-box h3 { margin: 0 0 10px 0; text-align: center; color: #ffeb3b; font-size: 16px; letter-spacing: 1px; }
    .ranking-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; padding: 4px; border-bottom: 1px solid #333;}
    .ranking-item:nth-child(2) { color: #ffd700; } 
    .ranking-item:nth-child(3) { color: #c0c0c0; } 
    .ranking-item:nth-child(4) { color: #cd7f32; } 
    
    /* Destaque para o Campeão (5 vitórias ou mais) */
    .champion { color: #00e676 !important; font-weight: bold; text-shadow: 0 0 5px rgba(0, 230, 118, 0.5); background: rgba(0, 230, 118, 0.1); border-radius: 4px; border-bottom: none; }
  </style>
</head>
<body>

  <div id="lobby">
    <h1>BOMBERMAN ONLINE</h1>
    <input type="text" id="p-name" placeholder="Seu Nome" maxlength="10">
    <input type="text" id="r-id" placeholder="ID da Sala (ex: sala1)">
    <button id="join-btn">ENTRAR NO JOGO</button>
    <p id="lobby-error"></p>
    <p style="font-size: 12px; margin-top: 10px;">O jogo inicia de 2 a 4 jogadores.</p>

    <div id="ranking-box">
      <h3>🏆 TOP 5 GLOBAIS 🏆</h3>
      <div id="ranking-list">Carregando placar...</div>
    </div>
  </div>

  <div id="status">Conecte-se para jogar</div>
  
  <div id="scoreboard">
    <div id="score-p1" class="score-side"></div>
    <div id="score-p2" class="score-side" style="justify-content: flex-end;"></div>
    <div id="score-p3" class="score-side"></div>
    <div id="score-p4" class="score-side" style="justify-content: flex-end;"></div>
  </div>

  <div id="room-share"></div>
  <div id="phase-banner"></div>
  <div id="event-log"></div>

  <div id="canvas-container">
    <canvas width="960" height="832" id="game"></canvas>
  </div>

  <div class="controls">
    <div class="dpad">
      <div style="grid-column: 2" class="btn" id="up">▲</div>
      <div style="grid-column: 1; grid-row: 2" class="btn" id="left">◀</div>
      <div style="grid-column: 3; grid-row: 2" class="btn" id="right">▶</div>
      <div style="grid-column: 2; grid-row: 3" class="btn" id="down">▼</div>
    </div>
    <div class="btn btn-bomb" id="bomb-btn">BOMBA</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAvDDcWaMa79_lPig78LCsHwdxqgMvf19I",
      authDomain: "bomberman-cc1db.firebaseapp.com",
      databaseURL: "https://bomberman-cc1db-default-rtdb.firebaseio.com",
      projectId: "bomberman-cc1db",
      storageBucket: "bomberman-cc1db.firebasestorage.app",
      messagingSenderId: "1029411431019",
      appId: "1:1029411431019:web:d07987a9abd4f33144072e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 64, rows = 13, cols = 15;
    
    const BOMB_FUSE_MS = 2000; 
    const EXPLOSION_VISIBLE_MS = 600;
    const RESPAWN_DELAY_MS = 3000;
    const BASE_BOMB_RANGE = 2; 
    const POWERUP_SPAWN_CHANCE = 0.45;

    let serverTimeOffset = 0;
    db.ref('.info/serverTimeOffset').on('value', snap => {
      serverTimeOffset = snap.val() || 0;
    });

    function getServerTime() {
      return Date.now() + serverTimeOffset;
    }

    let myId, myRoom, myName, roomRef;
    let players = {}, map = [], bombs = {}, powerups = {};
    let currentPhase = 1;
    let gameActive = false;
    let loopStarted = false;
    let knownPlayerIds = new Set();
    let eventLogTimeout = null;
    let processedBombIds = new Set();
    let localExplodedBombs = new Set(); 
    let myRespawnScheduled = false;
    let powerupAlternator = 'range';

    const SPAWNS = [
      { r: 1, c: 1 },              
      { r: rows - 2, c: cols - 2 }, 
      { r: 1, c: cols - 2 },        
      { r: rows - 2, c: 1 }         
    ];
    const COLORS = ['#2196f3', '#ff9800', '#9c27b0', '#4caf50']; 
    
    // Paletas de cores das fases
    const PHASE_VISUALS = [
      { bg: '#2e7d32', wall: '#444444', block: '#8b4513' }, // 1: Floresta (Verde)
      { bg: '#01579b', wall: '#0d47a1', block: '#4fc3f7' }, // 2: Gelo (Azul)
      { bg: '#b71c1c', wall: '#212121', block: '#ff9800' }, // 3: Fogo (Vermelho)
      { bg: '#4a148c', wall: '#1a237e', block: '#e040fb' }, // 4: Sombrio (Roxo)
      { bg: '#e65100', wall: '#3e2723', block: '#ffb300' }  // 5: Deserto (Laranja)
    ];

    const joinBtn = document.getElementById('join-btn');
    const lobbyError = document.getElementById('lobby-error');

    // LISTENER DO RANKING - CORRIGIDO PARA 5 VITÓRIAS
    db.ref('leaderboard').on('value', snap => {
      const listEl = document.getElementById('ranking-list');
      const data = snap.val() || {};
      
      const sorted = Object.entries(data)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5); 
      
      if (sorted.length === 0) {
        listEl.innerHTML = '<div style="text-align:center;color:#777;">Nenhuma vitória ainda</div>';
        return;
      }

      listEl.innerHTML = sorted.map(([name, score], idx) => {
        const isChampion = score >= 5; // Apenas 5 vitórias para brilhar
        let displayName = `${idx + 1}. ${name}`;
        
        if (isChampion) {
            displayName = `👑 ${name} (CAMPEÃO)`;
        }

        return `
        <div class="ranking-item ${isChampion ? 'champion' : ''}">
          <span>${displayName}</span>
          <span>${score} vit.</span>
        </div>
        `;
      }).join('');
    });

    function updateScoreboard() {
      const pArr = Object.values(players).sort((a, b) => a.slot - b.slot);
      
      for(let i = 0; i < 4; i++) {
        const el = document.getElementById(`score-p${i+1}`);
        if(!el) continue;
        
        if(pArr[i]) {
          if(i % 2 === 0) {
            el.innerHTML = `<span style="color:${pArr[i].color}">${pArr[i].name}</span>&nbsp; ${pArr[i].points || 0}`;
          } else {
            el.innerHTML = `${pArr[i].points || 0} &nbsp;<span style="color:${pArr[i].color}">${pArr[i].name}</span>`;
          }
        } else {
          el.innerHTML = '';
        }
      }
    }

    joinBtn.onclick = async () => {
      const nameInput = document.getElementById('p-name').value.trim();
      const roomVal = document.getElementById('r-id').value.trim();

      if (!roomVal) { lobbyError.innerText = 'Digite um ID da sala.'; return; }

      joinBtn.disabled = true;
      lobbyError.innerText = '';

      myName = nameInput || 'Bomber_' + Math.floor(Math.random() * 900 + 100);
      myRoom = roomVal;
      myId = 'p_' + Math.random().toString(36).substring(2, 9);

      try {
        roomRef = db.ref('rooms/' + myRoom);
        const snap = await roomRef.once('value');
        const existingData = snap.val() || {};
        const existingPlayers = existingData.players || {};
        const existingCount = Object.keys(existingPlayers).length;

        if (existingCount >= 4) {
          lobbyError.innerText = 'Sala cheia (Máximo 4 jogadores).';
          joinBtn.disabled = false;
          return;
        }

        if (!existingData.map) generateHardMap(roomRef, 1);

        const usedSlots = new Set(Object.values(existingPlayers).map(p => p.slot).filter(s => typeof s === 'number'));
        let slot = 0;
        while (usedSlots.has(slot) && slot < 4) slot++;
        if (slot >= 4) slot = existingCount % 4; 

        const spawn = SPAWNS[slot];
        const color = COLORS[slot];

        const myPlayerRef = roomRef.child('players/' + myId);
        await myPlayerRef.set({
          name: myName, r: spawn.r, c: spawn.c, alive: true, color: color, slot: slot, 
          bombRange: BASE_BOMB_RANGE, maxBombs: 1, points: 0
        });
        myPlayerRef.onDisconnect().remove();

        roomRef.child('players').on('value', s => {
          const newPlayers = s.val() || {};
          detectPlayerEvents(newPlayers);
          players = newPlayers;
          updateScoreboard(); 
          
          const count = Object.keys(players).length;
          gameActive = count >= 2;
          
          if (count < 2) {
            document.getElementById('status').innerText = `Aguardando jogadores... (${count}/4)`;
          } else {
            document.getElementById('status').innerText = 'BATALHA!';
            checkRoundEnd();
          }
        });

        roomRef.child('map').on('value', s => { map = s.val() || []; });
        
        roomRef.child('phase').on('value', s => {
          const p = s.val();
          if (p && p !== currentPhase) {
            currentPhase = p;
            let leaderName = "Empate";
            let maxPoints = -1;
            Object.values(players).forEach(pl => {
                const pts = pl.points || 0;
                if (pts > maxPoints) { maxPoints = pts; leaderName = pl.name; }
                else if (pts === maxPoints) { leaderName = "Empate"; }
            });
            showPhaseBanner(`FASE ${currentPhase} - Ganhando: ${leaderName} 🏆`);
          } else if (p) { currentPhase = p; }
        });
        
        roomRef.child('bombs').on('value', s => {
          const newBombs = s.val() || {};
          handleBombSync(newBombs);
          bombs = newBombs;
        });

        roomRef.child('powerups').on('value', s => { powerups = s.val() || {}; });

        document.getElementById('lobby').style.display = 'none';
        document.getElementById('room-share').innerText = `Sala: ${myRoom} — compartilhe o ID`;

        if (!loopStarted) {
          loopStarted = true;
          requestAnimationFrame(loop);
          setInterval(tickBombs, 50); 
        }
      } catch (err) {
        lobbyError.innerText = 'Erro ao conectar.';
        joinBtn.disabled = false;
      }
    };

    function showEventMessage(msg) {
      const el = document.getElementById('event-log');
      el.innerText = msg;
      el.style.opacity = '1';
      if (eventLogTimeout) clearTimeout(eventLogTimeout);
      eventLogTimeout = setTimeout(() => { el.style.opacity = '0'; }, 3000);
    }

    function showPhaseBanner(msg) {
      const el = document.getElementById('phase-banner');
      el.innerText = msg;
      setTimeout(() => { if (el.innerText === msg) el.innerText = ''; }, 2500);
    }

    function detectPlayerEvents(newPlayers) {
      const newIds = new Set(Object.keys(newPlayers));
      newIds.forEach(pid => {
        if (!knownPlayerIds.has(pid) && knownPlayerIds.size > 0 && pid !== myId) {
          showEventMessage(`${newPlayers[pid].name} entrou na sala`);
        }
      });
      knownPlayerIds.forEach(pid => {
        if (!newIds.has(pid)) {
          const leftName = (players[pid] && players[pid].name) || 'Jogador';
          showEventMessage(`${leftName} saiu da sala`);
        }
      });
      knownPlayerIds = newIds;
    }

    // AUMENTO PROGRESSIVO DA QUANTIDADE DE BLOCOS POR FASE
    function generateHardMap(ref, phaseNum) {
      let newMap = [];
      // A chance começa em 65% na fase 1 e aumenta até no máximo 95%
      const blockChance = Math.min(0.60 + (phaseNum * 0.05), 0.95);

      for (let r = 0; r < rows; r++) {
        newMap[r] = [];
        for (let c = 0; c < cols; c++) {
          if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1 || (r % 2 === 0 && c % 2 === 0)) {
            newMap[r][c] = 'W';
          } else if ((r < 4 && c < 4) || (r > rows - 5 && c > cols - 5) || (r < 4 && c > cols - 5) || (r > rows - 5 && c < 4)) {
            newMap[r][c] = ' ';
          } else {
            newMap[r][c] = Math.random() < blockChance ? 'S' : ' ';
          }
        }
      }
      ref.child('map').set(newMap);
      ref.child('phase').set(phaseNum);
      ref.child('bombs').remove();
      ref.child('powerups').remove();
      localExplodedBombs.clear(); 
    }

    function startNextPhase() {
      const ids = Object.keys(players).sort();
      if (ids[0] !== myId) return;

      const nextPhase = currentPhase + 1;
      generateHardMap(roomRef, nextPhase);

      const shuffledSpawns = [...SPAWNS].sort(() => Math.random() - 0.5);

      ids.forEach((pid, index) => {
        const spawn = shuffledSpawns[index % 4];
        roomRef.child('players/' + pid).update({ 
            r: spawn.r, 
            c: spawn.c, 
            alive: true, 
            bombRange: BASE_BOMB_RANGE, 
            maxBombs: 1 
        });
      });
    }

    function checkRoundEnd() {
      const ids = Object.keys(players);
      if (ids.length < 2) return;
      const aliveCount = ids.filter(pid => players[pid].alive).length;
      
      if (aliveCount <= 1 && !myRespawnScheduled) {
        myRespawnScheduled = true;
        let roundWinnerName = null;
        
        if (aliveCount === 1) {
          const winnerId = ids.find(pid => players[pid].alive);
          roundWinnerName = players[winnerId].name;
          
          if (winnerId === myId) {
            const myCurrentPoints = players[myId].points || 0;
            db.ref(`rooms/${myRoom}/players/${myId}`).update({ points: myCurrentPoints + 1 });
            
            const safeName = myName.replace(/[\.\#\$\[\]]/g, "_");
            db.ref(`leaderboard/${safeName}`).transaction((currentWins) => {
              return (currentWins || 0) + 1;
            });
          }
        }
        showPhaseBanner(aliveCount === 1 ? `${roundWinnerName} venceu a rodada! Próxima fase...` : 'Empate! Próxima fase...');
        setTimeout(() => {
          startNextPhase();
          myRespawnScheduled = false;
        }, RESPAWN_DELAY_MS);
      }
    }

    function isBombAt(r, c) {
      return Object.values(bombs).some(b => b.r === r && b.c === c && b.state !== 'exploding');
    }

    function move(dr, dc) {
      const me = players[myId];
      if (!gameActive || !me || !me.alive) return;
      const nr = me.r + dr, nc = me.c + dc;
      if (!map || !map[nr] || map[nr][nc] !== ' ') return;
      if (isBombAt(nr, nc)) return; 

      db.ref(`rooms/${myRoom}/players/${myId}`).update({ r: nr, c: nc });

      const pid = `pu_${nr}_${nc}`;
      const pu = powerups[pid];
      if (pu) {
        if (pu.type === 'amount') {
          const currentMax = me.maxBombs || 1;
          db.ref(`rooms/${myRoom}/players/${myId}`).update({ maxBombs: currentMax + 1 });
          showEventMessage('+1 Bomba Extra! 💣');
        } else {
          // LÓGICA DE ALCANCE: Quanto mais pega, maior o range da explosão de forma infinita
          const currentRange = me.bombRange || BASE_BOMB_RANGE;
          db.ref(`rooms/${myRoom}/players/${myId}`).update({ bombRange: currentRange + 1 });
          showEventMessage('Poder de fogo aumentado! 🔥');
        }
        db.ref(`rooms/${myRoom}/powerups/${pid}`).remove();
      }
    }

    function placeBomb() {
      const me = players[myId];
      if (!gameActive || !me || !me.alive) return;
      const { r, c } = me;
      const bid = `b_${myId}_${Date.now()}`;
      
      if (isBombAt(r, c)) return; 

      const myActiveBombs = Object.values(bombs).filter(b => b.owner === myId && b.state === 'ticking');
      const myMaxBombs = me.maxBombs || 1; 

      if (myActiveBombs.length >= myMaxBombs) return;

      db.ref(`rooms/${myRoom}/bombs/${bid}`).set({
        r, c, owner: myId, range: me.bombRange || BASE_BOMB_RANGE, plantedAt: firebase.database.ServerValue.TIMESTAMP, state: 'ticking'
      });
    }

    function tickBombs() {
      const serverNow = getServerTime(); 
      const me = players[myId];
      if (!me) return;

      Object.entries(bombs).forEach(([bid, b]) => {
        if (!b.plantedAt) return; 
        
        const ids = Object.keys(players).sort();
        const responsible = players[b.owner] ? b.owner : ids[0];
        const iAmResponsible = (responsible === myId);

        if (b.state === 'ticking' && serverNow - b.plantedAt >= BOMB_FUSE_MS) {
          if (iAmResponsible && !processedBombIds.has(bid)) {
            processedBombIds.add(bid);
            triggerExplosion(bid, b);
          }
        } 
        else if (b.state === 'exploding' && b.explodedAt && serverNow - b.explodedAt >= EXPLOSION_VISIBLE_MS) {
          if (iAmResponsible) {
            db.ref(`rooms/${myRoom}/bombs/${bid}`).remove();
          }
        }
      });
    }

    function triggerExplosion(bid, b) {
      const r = b.r, c = b.c, bombRange = b.range || BASE_BOMB_RANGE;
      const directions = [{ dr: 0, dc: 0 }, { dr: 1, dc: 0 }, { dr: -1, dc: 0 }, { dr: 0, dc: 1 }, { dr: 0, dc: -1 }];
      const hitCells = [];
      const blocksToDestroy = [];

      directions.forEach(({ dr, dc }) => {
        if (dr === 0 && dc === 0) {
          hitCells.push({ r, c });
          return;
        }
        for (let step = 1; step <= bombRange; step++) {
          const nr = r + dr * step, nc = c + dc * step;
          if (!map[nr] || map[nr][nc] === undefined) break; 
          if (map[nr][nc] === 'W') break; 

          hitCells.push({ r: nr, c: nc });

          if (map[nr][nc] === 'S') {
            blocksToDestroy.push({ r: nr, c: nc });
            break; 
          }
        }
      });

      db.ref(`rooms/${myRoom}/bombs/${bid}`).update({
         state: 'exploding',
         hitCells: hitCells,
         explodedAt: firebase.database.ServerValue.TIMESTAMP
      });

      blocksToDestroy.forEach(block => {
        db.ref(`rooms/${myRoom}/map/${block.r}/${block.c}`).set(' ');
        if (Math.random() < POWERUP_SPAWN_CHANCE) {
          powerupAlternator = powerupAlternator === 'range' ? 'amount' : 'range';
          db.ref(`rooms/${myRoom}/powerups/pu_${block.r}_${block.c}`).set({ r: block.r, c: block.c, type: powerupAlternator });
        }
      });
    }

    function handleBombSync(newBombs) {
      Object.keys(bombs).forEach(bid => {
        if (!newBombs[bid]) {
            processedBombIds.delete(bid);
            localExplodedBombs.delete(bid);
        }
      });
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // APLICAÇÃO DINÂMICA DA PALETA DE CORES DA FASE
      const visual = PHASE_VISUALS[(currentPhase - 1) % PHASE_VISUALS.length];
      canvas.style.backgroundColor = visual.bg;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (map[r] && map[r][c] === 'W') { 
              ctx.fillStyle = visual.wall; 
              ctx.fillRect(c * grid, r * grid, grid, grid); 
          }
          else if (map[r] && map[r][c] === 'S') { 
              ctx.fillStyle = visual.block; 
              ctx.fillRect(c * grid + 2, r * grid + 2, grid - 4, grid - 4); 
          }
        }
      }

      const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 200);
      
      Object.values(powerups).forEach(p => {
        ctx.fillStyle = p.type === 'amount' ? '#29b6f6' : '#ffca28'; 
        ctx.beginPath();
        ctx.arc((p.c + 0.5) * grid, (p.r + 0.5) * grid, grid * 0.28 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'amount' ? '💣' : '🔥', (p.c + 0.5) * grid, (p.r + 0.65) * grid);
        ctx.textAlign = 'left';
      });

      const serverNow = getServerTime(); 
      
      Object.entries(bombs).forEach(([bid, b]) => {
        if (b.state === 'exploding' && b.hitCells) {
            b.hitCells.forEach(cell => {
                ctx.fillStyle = 'rgba(255, 140, 0, 0.75)';
                ctx.fillRect(cell.c * grid, cell.r * grid, grid, grid);
                ctx.fillStyle = 'rgba(255, 235, 59, 0.9)';
                ctx.fillRect(cell.c * grid + 10, cell.r * grid + 10, grid - 20, grid - 20);
            });

            if (!localExplodedBombs.has(bid)) {
                localExplodedBombs.add(bid);
                const me = players[myId];
                if (me && me.alive) {
                    const hit = b.hitCells.some(c => c.r === me.r && c.c === me.c);
                    if (hit) { db.ref(`rooms/${myRoom}/players/${myId}`).update({ alive: false }); }
                }
            }
        } else if (b.state === 'ticking') {
            const elapsed = b.plantedAt ? serverNow - b.plantedAt : 0;
            const pulsing = elapsed > (BOMB_FUSE_MS - 800);
            ctx.fillStyle = pulsing ? '#ff5252' : '#000';
            ctx.beginPath();
            ctx.arc((b.c + 0.5) * grid, (b.r + 0.5) * grid, grid * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
      });

      ctx.font = '16px Courier New';
      Object.values(players).forEach(p => {
        if (!p.alive) return;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc((p.c + 0.5) * grid, (p.r + 0.5) * grid, grid * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText(p.name, p.c * grid + 10, p.r * grid);
      });

      requestAnimationFrame(loop);
    }

    const bind = (id, f) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); f(); });
      el.addEventListener('mousedown', f);
    };
    bind('up', () => move(-1, 0));
    bind('down', () => move(1, 0));
    bind('left', () => move(0, -1));
    bind('right', () => move(0, 1));
    bind('bomb-btn', placeBomb);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') move(-1, 0);
      if (e.key === 'ArrowDown') move(1, 0);
      if (e.key === 'ArrowLeft') move(0, -1);
      if (e.key === 'ArrowRight') move(0, 1);
      if (e.key === ' ') placeBomb();
    });
  </script>
</body>
</html>
